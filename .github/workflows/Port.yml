name: Sweezyy-Ginkgo-Real-Port

run-name: "🚀 Real Ginkgo Port · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Stock / Base ROM HTTPS URL"
        required: true
        type: string
      port_rom_url:
        description: "Port ROM HTTPS URL (or Ginkgo vendor/files link)"
        required: true
        type: string
      builder_name:
        description: "Builder name"
        required: false
        default: "Sweezyy"
        type: string
      request_id:
        description: "Request ID"
        required: true
        type: string

jobs:
  build:
    name: "🛠️ Real Unpack & Port Ginkgo ROM"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: "📥 Checkout Repo"
        uses: actions/checkout@v4

      - name: "💾 Maximize Disk Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "🧰 Install Port Tools & Extractors"
        run: |
          sudo killall apt apt-get || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
          sudo apt-get update --fix-missing || true
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --fix-broken --no-install-recommends \
            aria2 p7zip-full python3 python3-pip python3-bs4 brotli zstd wget curl erofs-utils android-sdk-libsparse-utils
          pip3 install --break-system-packages protobuf docopt humanize urllib3 beautifulsoup4 bs4 || pip3 install protobuf docopt humanize urllib3 beautifulsoup4 bs4
          git clone https://github.com/vm03/payload_dumper.git payload_dumper_tool

      - name: "📥 Download Base & Port ROMs"
        run: |
          mkdir -p workspace/downloads workspace/extracted workspace/ported
          echo "Downloading Base ROM..."
          aria2c -x 16 -s 16 -d workspace/downloads -o base_rom.zip "${{ inputs.stock_rom_url }}"
          
          if [[ "${{ inputs.port_rom_url }}" == http* ]]; then
            echo "Downloading Port Files/ROM..."
            aria2c -x 16 -s 16 -d workspace/downloads -o port_files.zip "${{ inputs.port_rom_url }}"
          fi

      - name: "🔓 Unpack ROM Images"
        run: |
          cd workspace/downloads
          echo "Extracting Zip files..."
          7z x base_rom.zip -o../extracted/base/
          if [ -f port_files.zip ]; then
            7z x port_files.zip -o../extracted/port/
          fi
          
          cd ../extracted/base
          if [ -f payload.bin ]; then
            echo "Extracting payload.bin..."
            python3 ../../../payload_dumper_tool/payload_dumper.py payload.bin --out ../unpacked_system/
          fi

      - name: "⚙️ Apply Ginkgo Specific Patches & Debloat"
        run: |
          echo "Applying Ginkgo device_features & configs..."
          mkdir -p workspace/extracted/unpacked_system/product/etc/device_features/
          
          if [ -f workspace/extracted/port/ginkgo.xml ]; then
            cp workspace/extracted/port/ginkgo.xml workspace/extracted/unpacked_system/product/etc/device_features/ginkgo.xml
          else
            echo '<features><bool name="support_companion">true</bool></features>' > workspace/extracted/unpacked_system/product/etc/device_features/ginkgo.xml
          fi

          echo "Debloating unused apps..."
          rm -rf workspace/extracted/unpacked_system/product/app/AnalyticsCore 2>/dev/null || true
          rm -rf workspace/extracted/unpacked_system/product/app/MSA 2>/dev/null || true

          echo "# Sweezyy Ginkgo Port Property" >> workspace/extracted/unpacked_system/system/build.prop || true
          echo "ro.product.device=ginkgo" >> workspace/extracted/unpacked_system/system/build.prop || true

      - name: "📦 Repack Ported ROM"
        run: |
          mkdir -p out
          cd workspace/extracted/
          echo "Repacking final Ginkgo ROM ZIP..."
          zip -r ../../out/Ginkgo_HyperOS_Sweezyy_Port.zip . -x "*.tmp"

      - name: "📤 Upload Finished Port ROM Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-Real-Ported-ROM
          path: out/Ginkgo_HyperOS_Sweezyy_Port.zip

      - name: "📣 Build Summary"
        if: always()
        run: |
          echo "## 🎉 Real Ginkgo ROM Porting Finished!" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Device:** Redmi Note 8 (Ginkgo)" >> $GITHUB_STEP_SUMMARY
