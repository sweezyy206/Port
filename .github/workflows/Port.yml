name: Port

on:
  workflow_dispatch:
    inputs:
      base_link:
        description: 'Base ROM Linki'
        required: true
        type: string
      ginkgo_file:
        description: 'Ginkgo Faylı'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Sənin port skriptin və ya əmrlərin burada yerləşir
      - name: Run Port Script
        run: |
          echo "Base Link: ${{ github.event.inputs.base_link }}"
          echo "Ginkgo File: ${{ github.event.inputs.ginkgo_file }}"
          # Buraya öz port əmrlərini yazabilərsən
