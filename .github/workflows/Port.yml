name: Deadzone Port Tool

on:
  workflow_dispatch:
    inputs:
      base_link:
        description: 'Base ROM Linki'
        required: true
        type: string
      ginkgo_file:
        description: 'Ginkgo Faylı'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Validate Port request
        run: echo "Validating request for Ginkgo..."

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set Cairo timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Port dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip openjdk-17-jdk

      - name: Build Stock + Port ROM
        run: |
          echo "Base Link: ${{ github.event.inputs.base_link }}"
          echo "Ginkgo File: ${{ github.event.inputs.ginkgo_file }}"
          # Burada əsl port skriptlərin işə düşür
          python3 -c "print('Porting process running for ginkgo...')"

      - name: Pack Port ROM
        run: |
          mkdir -p output_rom
          echo "Ported ROM" > output_rom/Ginkgo_Ported.zip

      - name: Package and upload Google Drive / Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-Ported-ROM
          path: output_rom/

      - name: Cleanup Port workspace
        run: |
          rm -rf workspace/*
          echo "Workspace cleaned up."

      - name: Build summary
        run: |
          echo "### 🚀 Port Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- Device: Ginkgo" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY
