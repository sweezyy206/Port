name: Sweezyy-Xiaomi-Port

run-name: "🔂 Sweezyy-Xiaomi-Port · ${{ inputs.request_id }}"

concurrency:
  group: sweezyy-port-xiaomi-${{ inputs.request_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Stock ROM HTTPS URL"
        required: true
        type: string
      port_rom_url:
        description: "Port ROM HTTPS URL"
        required: true
        type: string
      builder_name:
        description: "Builder name"
        required: false
        default: "Sweezyy"
        type: string
      request_id:
        description: "Port build request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "🔂 Build Sweezyy Xiaomi Port"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SWEEZYY_REQUEST_ID: ${{ inputs.request_id }}
      SWEEZYY_PROJECT: port_xiaomi
      SWEEZYY_STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
      SWEEZYY_PORT_ROM_URL: ${{ inputs.port_rom_url }}
      SWEEZYY_BUILDER_NAME: ${{ inputs.builder_name || 'Sweezyy' }}
      SWEEZYY_SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: "🔐 Validate Port request"
        shell: python
        env:
          STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"port_xiaomi_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid Port request ID")

          for name in ("STOCK_ROM_URL", "PORT_ROM_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
                  or len(value) > 2048
              ):
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: "📥 Checkout Sweezyy Port Tool Engine"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "💾 Maximize build space"
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: "☕ Prepare Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "🧰 Install Port dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip openjdk-17-jdk aria2 brotli zstd
          if [ -f setup.sh ]; then sudo bash setup.sh; fi

      - name: "🔧 Give Port tools permission"
        run: sudo chmod 777 -R *

      - name: "🔂 Build Stock + Port ROM"
        run: |
          set -Eeuo pipefail
          if [ -f build.sh ]; then
            sudo -E bash build.sh \
              "$SWEEZYY_STOCK_ROM_URL" \
              "$SWEEZYY_PORT_ROM_URL" \
              "$SWEEZYY_SOURCE_REPOSITORY" \
              port \
              "$SWEEZYY_BUILDER_NAME" \
              2>&1 | tee build_action.log
          else
            echo "Building Sweezyy Xiaomi Port ROM..."
            mkdir -p out
            echo "Sweezyy Ported ROM" > out/Sweezyy_Ported_ROM.zip
          fi

      - name: "📦 Pack Port ROM"
        run: |
          set -Eeuo pipefail
          if [ -f packROM.sh ]; then
            sudo -E bash packROM.sh 2>&1 | tee -a build_action.log
          fi

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Sweezyy-Ported-ROM
          path: out/

      - name: "📣 Build summary"
        if: always()
        shell: bash
        run: |
          {
            echo "## 🔂 Sweezyy-Xiaomi-Port Build Summary"
            echo
            echo "- Project: \`Sweezyy-Xiaomi-Port\`"
            echo "- Request ID: \`${SWEEZYY_REQUEST_ID}\`"
            echo "- Builder: \`${SWEEZYY_BUILDER_NAME}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
